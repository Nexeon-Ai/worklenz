name: Build & publish Arabic Worklenz images (GHCR)

# Builds the Worklenz frontend (Arabic + RTL UI) and backend (Arabic emails &
# notifications) and publishes them to this fork's GitHub Container Registry
# so the Coolify deployment can pull them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Moving tag to publish (immutable ar-<sha> is always pushed too)'
        default: 'ar'
        required: false
  push:
    branches: [feat/arabic-rtl]
    paths:
      - 'worklenz-frontend/**'
      - 'worklenz-backend/**'
      - '.github/workflows/build-arabic-frontend.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          MOVING="${{ github.event.inputs.tag || 'ar' }}"
          echo "tags=ghcr.io/${OWNER}/worklenz-${{ matrix.component }}:${MOVING},ghcr.io/${OWNER}/worklenz-${{ matrix.component }}:ar-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worklenz-${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
